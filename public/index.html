
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chandana's Shop | E-Commerce</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      color: #222;
    }
    header {
      background: #202b46;
      color: white;
      padding: 20px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    header h1 { margin: 0; font-size: 23px; }
    main { max-width: 1100px; margin: auto; padding: 25px 16px; }
    .panel {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 22px;
      box-shadow: 0 2px 10px #0000000d;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border: 1px solid #ccc;
      border-radius: 7px;
    }
    button {
      background: #4056a1;
      color: white;
      border: 0;
      padding: 11px 16px;
      margin: 5px 3px 5px 0;
      border-radius: 7px;
      cursor: pointer;
    }
    button:hover { background: #293d83; }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }
    .product {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #0000000d;
    }
    .product .emoji { font-size: 42px; }
    .price { color: #16834a; font-weight: bold; }
    #message { font-weight: bold; margin-top: 10px; }
    @media (max-width: 600px) {
      header { padding: 18px; }
      header h1 { font-size: 20px; }
      main { padding: 15px 12px; }
    }
  </style>
</head>
<body>
<header>
  <h1>🛍️ Chandana's Shop</h1>
  <div>
    <span id="userStatus">Guest</span>
    <button onclick="showCart()">My Cart</button>
    <button onclick="logout()">Logout</button>
  </div>
</header>

<main>
  <section class="panel">
    <h2>Welcome to Our Store!</h2>
    <p>Discover useful products at affordable prices.</p>
  </section>

  <section class="panel">
    <h2>Account</h2>
    <input id="name" placeholder="Full name (for registration)">
    <input id="email" type="email" placeholder="Email address">
    <input id="password" type="password" placeholder="Password (minimum 8 characters)">
    <button onclick="register()">Register</button>
    <button onclick="login()">Login</button>
    <p id="message"></p>
  </section>

  <section>
    <h2>Our Products</h2>
    <div class="products" id="products">
      Loading products...
    </div>
  </section>

  <section class="panel" id="cartSection">
    <h2>🛒 Shopping Cart</h2>
    <div id="cart">Login to view your cart.</div>
    <button onclick="checkout()">Proceed to Checkout</button>
  </section>
</main>

<script>
const API = "";
let token = localStorage.getItem("shopToken");

function message(text) {
  document.getElementById("message").textContent = text;
}

async function request(path, options = {}) {
  const headers = {
    "Content-Type": "application/json",
    ...(token ? { Authorization: "Bearer " + token } : {}),
    ...(options.headers || {})
  };

  const response = await fetch(API + path, { ...options, headers });
  const data = await response.json();

  if (!response.ok) throw new Error(data.error || "Request failed");
  return data;
}

async function register() {
  try {
    const data = await request("/api/register", {
      method: "POST",
      body: JSON.stringify({
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value
      })
    });
    message(data.message + ". Please log in.");
  } catch (error) {
    message(error.message);
  }
}

async function login() {
  try {
    const data = await request("/api/login", {
      method: "POST",
      body: JSON.stringify({
        email: document.getElementById("email").value,
        password: document.getElementById("password").value
      })
    });
    token = data.token;
    localStorage.setItem("shopToken", token);
    document.getElementById("userStatus").textContent = data.user.name;
    message("Login successful!");
    showCart();
  } catch (error) {
    message(error.message);
  }
}

function logout() {
  token = null;
  localStorage.removeItem("shopToken");
  document.getElementById("userStatus").textContent = "Guest";
  document.getElementById("cart").textContent = "Login to view your cart.";
  message("You have logged out.");
}

async function loadProducts() {
  try {
    const products = await request("/api/products");
    const icons = ["🎧", "⌚", "🎒", "🖱️"];

    document.getElementById("products").innerHTML =
      products.map((p, i) => `
        <article class="product">
          <div class="emoji">${icons[i % icons.length]}</div>
          <h3>${escapeHTML(p.name)}</h3>
          <p>${escapeHTML(p.description || "")}</p>
          <p class="price">₹${Number(p.price).toFixed(2)}</p>
          <p>Available: ${p.stock}</p>
          <button onclick="addToCart(${p.id})">Add to Cart</button>
        </article>
      `).join("");
  } catch (error) {
    document.getElementById("products").textContent =
      "Products could not be loaded. Please try again later.";
  }
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  })[char]);
}

async function addToCart(id) {
  if (!token) return message("Please log in first.");

  try {
    const data = await request("/api/cart", {
      method: "POST",
      body: JSON.stringify({ product_id: id, quantity: 1 })
    });
    message(data.message);
    showCart();
  } catch (error) {
    message(error.message);
  }
}

async function showCart() {
  if (!token) {
    document.getElementById("cart").textContent = "Please log in first.";
    return;
  }

  try {
    const items = await request("/api/cart");
    if (!items.length) {
      document.getElementById("cart").textContent = "Your cart is empty.";
      return;
    }

    document.getElementById("cart").innerHTML = items.map(item => `
      <p>${escapeHTML(item.name)} × ${item.quantity}
      — ₹${(Number(item.price) * item.quantity).toFixed(2)}
      <button onclick="removeItem(${item.product_id})">Remove</button></p>
    `).join("");
  } catch (error) {
    document.getElementById("cart").textContent = error.message;
  }
}

async function removeItem(id) {
  try {
    await request("/api/cart/" + id, { method: "DELETE" });
    showCart();
  } catch (error) {
    message(error.message);
  }
}

async function checkout() {
  if (!token) return message("Please log in first.");

  try {
    const data = await request("/api/checkout", { method: "POST" });
    window.location.href = data.checkoutUrl;
  } catch (error) {
    message(error.message);
  }
}

if (token) {
  document.getElementById("userStatus").textContent = "Logged in";
}
loadProducts();
</script>
</body>
</html>
