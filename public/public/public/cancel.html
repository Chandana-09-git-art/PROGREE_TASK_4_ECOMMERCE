
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Cancelled</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff5f2;
      text-align: center;
      padding: 50px 15px;
    }
    .box {
      max-width: 450px;
      margin: auto;
      background: white;
      padding: 35px 20px;
      border-radius: 15px;
    }
    h1 { color: #c65332; }
    a {
      display: inline-block;
      background: #4056a1;
      color: white;
      padding: 12px 20px;
      border-radius: 7px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Payment Cancelled</h1>
    <p>Your payment was not completed.</p>
    <p>Your shopping cart is still available.</p>
    <a href="/">Return to Shopping</a>
  </div>
</body>
</html>
